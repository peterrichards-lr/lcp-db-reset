[package]
name = "lcp-db-reset"
version = "1.0.2"
edition = "2021"
authors = ["Peter Richards <peter.richards@liferay.com>"]
description = "A Liferay Cloud utility to reset the database schema."
license = "MIT"
repository = "https://github.com/peterrichards-lr/lcp-db-reset"
homepage = "https://github.com/peterrichards-lr/lcp-db-reset"
readme = "README.md"
keywords = ["liferay", "dxp", "cli", "rust", "lcp", "database"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI Argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# XML Processing (Crucial for Tomcat/Liferay configs)
edit-xml = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Configuration & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = "0.4"    # Timestamps for logs/backups
dialoguer = "0.12" # For password prompt

# Optional dependencies for features
reqwest = { version = "0.11", features = ["blocking"], optional = true }
scraper = { version = "0.18", optional = true }
serde_yaml = { version = "0.9", optional = true }
tempfile = "3.8"

[features]
default = []
web = ["reqwest", "scraper"]
yaml = ["serde_yaml"]

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce parallel code generation units to increase optimization
panic = "abort"     # Abort on panic
strip = true        # Strip symbols from binary
